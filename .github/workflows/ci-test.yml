name: CI Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-multi-project
  cancel-in-progress: true
jobs:
  unit-and-static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run preflight:cloudflare
      - run: pnpm check
      - run: pnpm test
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @hendy/web-admin build
        env:
          VITE_API_BASE_URL: https://api.example.invalid
      - run: pnpm --filter @hendy/mini-app build
        env:
          VITE_API_BASE_URL: https://api.example.invalid
      - run: pnpm --filter @hendy/web-user build
        env:
          VITE_API_BASE_URL: https://api.example.invalid
