name: Sync Runtime Secrets
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type SYNC to upload configured GitHub secrets to Cloudflare Workers
        required: true
        type: string
permissions:
  contents: read
jobs:
  sync:
    if: ${{ inputs.confirm == 'SYNC' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Validate required secret material
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
          BANK_WEBHOOK_SECRET: ${{ secrets.BANK_WEBHOOK_SECRET }}
          HENDY_GITHUB_TOKEN: ${{ secrets.HENDY_GITHUB_TOKEN }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/validate-secrets.mjs
      - name: Sync API secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
          BANK_WEBHOOK_SECRET: ${{ secrets.BANK_WEBHOOK_SECRET }}
          BANK_API_KEY: ${{ secrets.BANK_API_KEY }}
          BANK_API_SECRET: ${{ secrets.BANK_API_SECRET }}
          GITHUB_TOKEN: ${{ secrets.HENDY_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for key in BOT_TOKEN SESSION_SECRET ADMIN_TELEGRAM_IDS GITHUB_TOKEN; do
            printf '%s' "${!key}" | pnpm exec wrangler secret put "$key" --config workers/platform-api/wrangler.toml
          done
          if [[ -n "$BANK_WEBHOOK_SECRET" ]]; then printf '%s' "$BANK_WEBHOOK_SECRET" | pnpm exec wrangler secret put BANK_WEBHOOK_SECRET --config workers/platform-api/wrangler.toml; fi
          if [[ -n "$BANK_API_KEY" ]]; then printf '%s' "$BANK_API_KEY" | pnpm exec wrangler secret put BANK_API_KEY --config workers/platform-api/wrangler.toml; fi
          if [[ -n "$BANK_API_SECRET" ]]; then printf '%s' "$BANK_API_SECRET" | pnpm exec wrangler secret put BANK_API_SECRET --config workers/platform-api/wrangler.toml; fi
      - name: Sync Queue Processor secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HENDY_GITHUB_TOKEN: ${{ secrets.HENDY_GITHUB_TOKEN }}
          BANK_API_SECRET: ${{ secrets.BANK_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$HENDY_GITHUB_TOKEN" | pnpm exec wrangler secret put GITHUB_TOKEN --config workers/queue-processor/wrangler.toml
          if [[ -n "$BANK_API_SECRET" ]]; then printf '%s' "$BANK_API_SECRET" | pnpm exec wrangler secret put BANK_SYNC_SECRET --config workers/queue-processor/wrangler.toml; fi
      - name: Sync Self-healing Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
          HENDY_GITHUB_TOKEN: ${{ secrets.HENDY_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_WEBHOOK_SECRET" | pnpm exec wrangler secret put WEBHOOK_SECRET --config workers/self-healing-bot/wrangler.toml
          printf '%s' "$HENDY_GITHUB_TOKEN" | pnpm exec wrangler secret put GITHUB_TOKEN --config workers/self-healing-bot/wrangler.toml
