name: Sync Cloudflare Domains
on:
  workflow_dispatch:
    inputs:
      target:
        description: Pages deployment scope to inspect
        type: choice
        options: [all, miniapp, web]
        default: all
        required: true
permissions:
  contents: read
concurrency:
  group: sync-cloudflare-domains
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify domain sync credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HENDY_GITHUB_TOKEN: ${{ secrets.HENDY_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          [[ -n "$HENDY_GITHUB_TOKEN" ]] || { echo "Missing HENDY_GITHUB_TOKEN" >&2; exit 1; }
      - name: Detect Pages domains and update central variables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HENDY_GITHUB_TOKEN: ${{ secrets.HENDY_GITHUB_TOKEN }}
          MINIAPP_PAGES_PROJECT: ${{ vars.MINIAPP_PAGES_PROJECT || 'hendy-mini-app' }}
          ADMIN_PAGES_PROJECT: ${{ vars.ADMIN_PAGES_PROJECT || 'hendy-web-admin' }}
          STOREFRONT_PAGES_PROJECT: ${{ vars.STOREFRONT_PAGES_PROJECT || 'hendy-app-storefront' }}
        run: node scripts/sync-deployment-domains.mjs "${{ inputs.target }}"
