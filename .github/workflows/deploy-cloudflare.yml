name: Deploy Cloudflare Platform
on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'workers/**'
      - 'packages/**'
      - 'database/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hendy-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy Workers and three Pages projects
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      BOT_WEBHOOK_SECRET: ${{ secrets.BOT_WEBHOOK_SECRET }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
      HENDY_GITHUB_TOKEN: ${{ secrets.HENDY_GITHUB_TOKEN }}
      GITHUB_OWNER: ngogiaidy56-eng
      GITHUB_REPO: HendyAppStoreBotTelegram
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate production credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BOT_TOKEN BOT_WEBHOOK_SECRET SESSION_SECRET ADMIN_TELEGRAM_IDS HENDY_GITHUB_TOKEN GITHUB_WEBHOOK_SECRET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
      - name: Provision or reuse D1, KV, R2 and Queues
        id: resources
        run: node scripts/provision-cloudflare-resources.mjs
      - name: Ensure three Pages projects and detect API/bot URLs
        id: domains
        env:
          HENDY_GITHUB_TOKEN: ${{ secrets.HENDY_GITHUB_TOKEN }}
          WORKER_SUBDOMAIN: ${{ vars.WORKER_SUBDOMAIN }}
          WORKER_API_URL: ${{ vars.WORKER_API_URL }}
          TELEGRAM_BOT_WORKER_URL: ${{ vars.TELEGRAM_BOT_WORKER_URL }}
          SELF_HEALING_WORKER_URL: ${{ vars.SELF_HEALING_WORKER_URL }}
          MINIAPP_DOMAIN_OVERRIDE: ${{ vars.MINIAPP_DOMAIN_OVERRIDE }}
          ADMIN_DOMAIN_OVERRIDE: ${{ vars.ADMIN_DOMAIN_OVERRIDE }}
          WEB_USER_DOMAIN_OVERRIDE: ${{ vars.WEB_USER_DOMAIN_OVERRIDE }}
          MINIAPP_PAGES_PROJECT: hendy-mini-app
          ADMIN_PAGES_PROJECT: hendy-web-admin
          WEB_USER_PAGES_PROJECT: hendy-web-user
        run: node scripts/sync-deployment-domains.mjs all
      - name: Configure Worker IDs, URLs and runtime variables
        env:
          CLOUDFLARE_WORKER_TARGET: all
          CLOUDFLARE_D1_DATABASE_ID: ${{ steps.resources.outputs.d1_id }}
          CLOUDFLARE_DEDUPE_KV_NAMESPACE_ID: ${{ steps.resources.outputs.kv_id }}
          APP_URL: ${{ steps.domains.outputs.miniapp_url }}
          ADMIN_URL: ${{ steps.domains.outputs.admin_url }}
          STOREFRONT_URL: ${{ steps.domains.outputs.web_user_url }}
          CORS_ORIGINS: ${{ steps.domains.outputs.cors_origins }}
          BOT_USERNAME: ${{ vars.BOT_USERNAME }}
          MIN_DEPOSIT_VND: ${{ vars.MIN_DEPOSIT_VND }}
          MAX_DEPOSIT_VND: ${{ vars.MAX_DEPOSIT_VND }}
          DAILY_CHECKIN_REWARD_VND: ${{ vars.DAILY_CHECKIN_REWARD_VND }}
          REFERRAL_REWARD_VND: ${{ vars.REFERRAL_REWARD_VND }}
          SESSION_TTL_SECONDS: ${{ vars.SESSION_TTL_SECONDS }}
          MAX_INIT_DATA_AGE_SECONDS: ${{ vars.MAX_INIT_DATA_AGE_SECONDS }}
          BANK_ID: ${{ vars.BANK_ID }}
          BANK_ACCOUNT_NUMBER: ${{ vars.BANK_ACCOUNT_NUMBER }}
          BANK_ACCOUNT_NAME: ${{ vars.BANK_ACCOUNT_NAME }}
          BANK_SYNC_URL: ${{ vars.BANK_SYNC_URL }}
          TASKS_CONFIG_JSON: ${{ vars.TASKS_CONFIG_JSON }}
          MINIGAME_CONFIG_JSON: ${{ vars.MINIGAME_CONFIG_JSON }}
          GITHUB_OWNER: ngogiaidy56-eng
          GITHUB_REPO: HendyAppStoreBotTelegram
        run: node scripts/configure-wrangler.mjs
      - name: Ensure Queues exist
        shell: bash
        run: |
          set -euo pipefail
          for queue in hendy-jobs hendy-jobs-dlq; do
            if ! pnpm exec wrangler queues create "$queue" 2>&1; then
              # "already exists" is the expected idempotent case.
              pnpm exec wrangler queues list | grep -Fq "$queue" || {
                echo "::error::Could not ensure Cloudflare Queue $queue"
                exit 1
              }
            fi
          done
      - name: Apply remote D1 migrations
        run: pnpm exec wrangler d1 migrations apply hendyappstore-db --remote --config workers/platform-api/wrangler.toml
      - name: Deploy platform API Worker
        run: pnpm exec wrangler deploy --config workers/platform-api/wrangler.toml
      - name: Deploy Telegram bot Worker
        run: pnpm exec wrangler deploy --config workers/telegram-bot/wrangler.toml
      - name: Deploy Queue processor Worker
        run: pnpm exec wrangler deploy --config workers/queue-processor/wrangler.toml
      - name: Deploy edge router Worker
        run: pnpm exec wrangler deploy --config workers/edge-router/wrangler.toml
      - name: Deploy self-healing Worker
        run: pnpm exec wrangler deploy --config workers/self-healing-bot/wrangler.toml
      - name: Synchronize runtime secrets to Workers
        shell: bash
        env:
          BANK_WEBHOOK_SECRET: ${{ secrets.BANK_WEBHOOK_SECRET }}
          BANK_API_KEY: ${{ secrets.BANK_API_KEY }}
          BANK_API_SECRET: ${{ secrets.BANK_API_SECRET }}
          BANK_SYNC_SECRET: ${{ secrets.BANK_SYNC_SECRET }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          put_secret() {
            local config="$1" key="$2" value="$3"
            if [[ -n "$value" ]]; then
              printf '%s' "$value" | pnpm exec wrangler secret put "$key" --config "$config" >/dev/null
              echo "Updated secret $key for $config."
            fi
          }
          put_secret workers/platform-api/wrangler.toml BOT_TOKEN "$BOT_TOKEN"
          put_secret workers/platform-api/wrangler.toml SESSION_SECRET "$SESSION_SECRET"
          put_secret workers/platform-api/wrangler.toml ADMIN_TELEGRAM_IDS "$ADMIN_TELEGRAM_IDS"
          put_secret workers/platform-api/wrangler.toml BANK_WEBHOOK_SECRET "$BANK_WEBHOOK_SECRET"
          put_secret workers/platform-api/wrangler.toml BANK_API_KEY "$BANK_API_KEY"
          put_secret workers/platform-api/wrangler.toml BANK_API_SECRET "$BANK_API_SECRET"
          put_secret workers/platform-api/wrangler.toml GITHUB_TOKEN "$HENDY_GITHUB_TOKEN"
          put_secret workers/platform-api/wrangler.toml GITHUB_WEBHOOK_SECRET "$GITHUB_WEBHOOK_SECRET"
          put_secret workers/telegram-bot/wrangler.toml BOT_TOKEN "$BOT_TOKEN"
          put_secret workers/telegram-bot/wrangler.toml BOT_WEBHOOK_SECRET "$BOT_WEBHOOK_SECRET"
          put_secret workers/telegram-bot/wrangler.toml ADMIN_TELEGRAM_IDS "$ADMIN_TELEGRAM_IDS"
          put_secret workers/telegram-bot/wrangler.toml GITHUB_TOKEN "$HENDY_GITHUB_TOKEN"
          put_secret workers/queue-processor/wrangler.toml BOT_TOKEN "$BOT_TOKEN"
          put_secret workers/queue-processor/wrangler.toml GITHUB_TOKEN "$HENDY_GITHUB_TOKEN"
          put_secret workers/queue-processor/wrangler.toml BANK_SYNC_SECRET "$BANK_SYNC_SECRET"
          put_secret workers/self-healing-bot/wrangler.toml GITHUB_TOKEN "$HENDY_GITHUB_TOKEN"
          put_secret workers/self-healing-bot/wrangler.toml WEBHOOK_SECRET "$GITHUB_WEBHOOK_SECRET"
      - name: Configure Telegram webhook
        env:
          TELEGRAM_BOT_WORKER_URL: ${{ steps.domains.outputs.telegram_bot_url }}
        run: node scripts/configure-telegram-webhook.mjs
      - name: Configure GitHub self-healing webhook
        env:
          HENDY_GITHUB_TOKEN: ${{ secrets.HENDY_GITHUB_TOKEN }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
          SELF_HEALING_WORKER_URL: ${{ steps.domains.outputs.self_healing_worker_url }}
        run: node scripts/configure-github-webhook.mjs
      - name: Build Admin Pages
        env:
          VITE_API_BASE_URL: ${{ steps.domains.outputs.api_url }}
        run: pnpm --filter @hendy/web-admin build
      - name: Deploy hendy-web-admin
        working-directory: apps/web-admin
        run: ../../node_modules/.bin/wrangler pages deploy dist --project-name hendy-web-admin --branch main
      - name: Build Telegram Mini App Pages
        env:
          VITE_API_BASE_URL: ${{ steps.domains.outputs.api_url }}
        run: pnpm --filter @hendy/mini-app build
      - name: Deploy hendy-mini-app
        working-directory: apps/mini-app
        run: ../../node_modules/.bin/wrangler pages deploy dist --project-name hendy-mini-app --branch main
      - name: Build user Storefront Pages
        env:
          VITE_API_BASE_URL: ${{ steps.domains.outputs.api_url }}
        run: pnpm --filter @hendy/web-user build
      - name: Deploy hendy-web-user
        working-directory: apps/web-user
        run: ../../node_modules/.bin/wrangler pages deploy dist --project-name hendy-web-user --branch main
      - name: Refresh domain URLs and GitHub Actions Variables
        id: domains_final
        env:
          HENDY_GITHUB_TOKEN: ${{ secrets.HENDY_GITHUB_TOKEN }}
          WORKER_SUBDOMAIN: ${{ vars.WORKER_SUBDOMAIN }}
          WORKER_API_URL: ${{ vars.WORKER_API_URL }}
          TELEGRAM_BOT_WORKER_URL: ${{ vars.TELEGRAM_BOT_WORKER_URL }}
          SELF_HEALING_WORKER_URL: ${{ vars.SELF_HEALING_WORKER_URL }}
          MINIAPP_DOMAIN_OVERRIDE: ${{ vars.MINIAPP_DOMAIN_OVERRIDE }}
          ADMIN_DOMAIN_OVERRIDE: ${{ vars.ADMIN_DOMAIN_OVERRIDE }}
          WEB_USER_DOMAIN_OVERRIDE: ${{ vars.WEB_USER_DOMAIN_OVERRIDE }}
          MINIAPP_PAGES_PROJECT: hendy-mini-app
          ADMIN_PAGES_PROJECT: hendy-web-admin
          WEB_USER_PAGES_PROJECT: hendy-web-user
        run: node scripts/sync-deployment-domains.mjs all
      - name: Apply final URLs and CORS to API/Bot Workers
        env:
          CLOUDFLARE_WORKER_TARGET: all
          CLOUDFLARE_D1_DATABASE_ID: ${{ steps.resources.outputs.d1_id }}
          CLOUDFLARE_DEDUPE_KV_NAMESPACE_ID: ${{ steps.resources.outputs.kv_id }}
          APP_URL: ${{ steps.domains_final.outputs.miniapp_url }}
          ADMIN_URL: ${{ steps.domains_final.outputs.admin_url }}
          STOREFRONT_URL: ${{ steps.domains_final.outputs.web_user_url }}
          CORS_ORIGINS: ${{ steps.domains_final.outputs.cors_origins }}
          BOT_USERNAME: ${{ vars.BOT_USERNAME }}
          MIN_DEPOSIT_VND: ${{ vars.MIN_DEPOSIT_VND }}
          MAX_DEPOSIT_VND: ${{ vars.MAX_DEPOSIT_VND }}
          DAILY_CHECKIN_REWARD_VND: ${{ vars.DAILY_CHECKIN_REWARD_VND }}
          REFERRAL_REWARD_VND: ${{ vars.REFERRAL_REWARD_VND }}
          SESSION_TTL_SECONDS: ${{ vars.SESSION_TTL_SECONDS }}
          MAX_INIT_DATA_AGE_SECONDS: ${{ vars.MAX_INIT_DATA_AGE_SECONDS }}
          BANK_ID: ${{ vars.BANK_ID }}
          BANK_ACCOUNT_NUMBER: ${{ vars.BANK_ACCOUNT_NUMBER }}
          BANK_ACCOUNT_NAME: ${{ vars.BANK_ACCOUNT_NAME }}
          BANK_SYNC_URL: ${{ vars.BANK_SYNC_URL }}
          TASKS_CONFIG_JSON: ${{ vars.TASKS_CONFIG_JSON }}
          MINIGAME_CONFIG_JSON: ${{ vars.MINIGAME_CONFIG_JSON }}
          GITHUB_OWNER: ngogiaidy56-eng
          GITHUB_REPO: HendyAppStoreBotTelegram
        run: |
          node scripts/configure-wrangler.mjs
          pnpm exec wrangler deploy --config workers/platform-api/wrangler.toml
          pnpm exec wrangler deploy --config workers/telegram-bot/wrangler.toml
