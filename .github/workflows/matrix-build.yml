name: Native Release Matrix (signed artifacts to private R2)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native target to build. Each target requires its real source project under native/.
        required: true
        type: choice
        options: [android, ios, windows, macos, all]
        default: android
      version:
        description: Release version, for example 2.4.1. Must match the app version configured in the native project.
        required: true
        type: string
        default: 0.1.0
permissions:
  contents: read
concurrency:
  group: native-release-${{ inputs.platform }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  build:
    name: Build and sign ${{ matrix.platform }}
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'all' && '["android","ios","windows","macos"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ matrix.platform == 'android' && 'ubuntu-latest' || (matrix.platform == 'windows' && 'windows-latest' || 'macos-latest') }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]{0,63}$ ]] || { echo "::error::Invalid release version format."; exit 1; }
      - name: Set up Java for Android
        if: ${{ matrix.platform == 'android' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up .NET for Windows
        if: ${{ matrix.platform == 'windows' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate Android project and signing inputs
        if: ${{ matrix.platform == 'android' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -x native/android/gradlew || { echo "::error::Missing native/android/gradlew. Add the real Android Gradle project before running this target."; exit 1; }
          test -f native/android/settings.gradle -o -f native/android/settings.gradle.kts || { echo "::error::Missing Android settings.gradle."; exit 1; }
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!key:-}" ]] || { echo "::error::Missing signing secret $key."; exit 1; }
          done
      - name: Build and verify Android APK/AAB
        if: ${{ matrix.platform == 'android' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/hendy-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          export ORG_GRADLE_PROJECT_signingStoreFile="$KEYSTORE"
          export ORG_GRADLE_PROJECT_signingStorePassword="$ANDROID_KEYSTORE_PASSWORD"
          export ORG_GRADLE_PROJECT_signingKeyAlias="$ANDROID_KEY_ALIAS"
          export ORG_GRADLE_PROJECT_signingKeyPassword="$ANDROID_KEY_PASSWORD"
          (cd native/android && ./gradlew --no-daemon clean assembleRelease bundleRelease)
          mkdir -p release-output/android
          while IFS= read -r -d '' file; do cp "$file" release-output/android/; done < <(find native/android -path '*/build/outputs/apk/release/*' -type f -name '*.apk' -print0)
          while IFS= read -r -d '' file; do cp "$file" release-output/android/; done < <(find native/android -path '*/build/outputs/bundle/release/*' -type f -name '*.aab' -print0)
          shopt -s nullglob
          artifacts=(release-output/android/*.apk release-output/android/*.aab)
          (( ${#artifacts[@]} > 0 )) || { echo "::error::Gradle produced no release APK/AAB files."; exit 1; }
          for file in release-output/android/*.apk; do
            apksigner verify --verbose "$file"
          done
          for file in release-output/android/*.aab; do
            jarsigner -verify -strict -certs "$file"
          done
          rm -f "$KEYSTORE"
      - name: Validate iOS project and signing inputs
        if: ${{ matrix.platform == 'ios' }}
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_SCHEME: ${{ vars.IOS_SCHEME }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          test -d native/ios || { echo "::error::Missing native/ios Xcode project. This repository does not currently include native iOS source."; exit 1; }
          find native/ios -maxdepth 4 \( -name '*.xcworkspace' -o -name '*.xcodeproj' \) -print -quit | grep -q . || { echo "::error::No .xcworkspace/.xcodeproj found in native/ios."; exit 1; }
          for key in IOS_CERTIFICATE_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 APPLE_TEAM_ID IOS_SCHEME IOS_BUNDLE_ID; do
            [[ -n "${!key:-}" ]] || { echo "::error::Missing iOS signing/config value $key."; exit 1; }
          done
          [[ "$IOS_BUNDLE_ID" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]] || { echo "::error::IOS_BUNDLE_ID is invalid."; exit 1; }
      - name: Archive, sign and export iOS IPA
        if: ${{ matrix.platform == 'ios' }}
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_SCHEME: ${{ vars.IOS_SCHEME }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/hendy-ios.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT="$RUNNER_TEMP/ios-distribution.p12"
          PROFILE="$RUNNER_TEMP/ios-profile.mobileprovision"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$IOS_CERTIFICATE_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"
          PROFILE_PLIST="$RUNNER_TEMP/ios-profile.plist"
          security cms -D -i "$PROFILE" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          PROJECT="$(find native/ios -maxdepth 4 -name '*.xcworkspace' -print -quit)"
          PROJECT_FLAG="-workspace"
          if [[ -z "$PROJECT" ]]; then PROJECT="$(find native/ios -maxdepth 4 -name '*.xcodeproj' -print -quit)"; PROJECT_FLAG="-project"; fi
          xcodebuild "$PROJECT_FLAG" "$PROJECT" -scheme "$IOS_SCHEME" -configuration Release -archivePath "$RUNNER_TEMP/HendyIOS.xcarchive" archive CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>ad-hoc</string>
          <key>teamID</key><string>$APPLE_TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key><dict><key>$IOS_BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          mkdir -p release-output/ios
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/HendyIOS.xcarchive" -exportPath "$RUNNER_TEMP/ios-export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA="$(find "$RUNNER_TEMP/ios-export" -maxdepth 2 -name '*.ipa' -print -quit)"
          test -n "$IPA" || { echo "::error::Xcode export did not produce an IPA."; exit 1; }
          cp "$IPA" "release-output/ios/HendyAppStore-$RELEASE_VERSION.ipa"
          rm -f "$CERT" "$PROFILE" "$KEYCHAIN"
      - name: Validate Windows project and signing inputs
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not (Test-Path 'native/windows')) { throw 'Missing native/windows .NET source. Add a real Windows project before running this target.' }
          $projects = @(Get-ChildItem native/windows -Recurse -Filter *.csproj)
          if ($projects.Count -ne 1) { throw "Expected exactly one .csproj under native/windows; found $($projects.Count)." }
          if (-not $env:WINDOWS_PFX_BASE64 -or -not $env:WINDOWS_PFX_PASSWORD) { throw 'Missing WINDOWS_PFX_BASE64 or WINDOWS_PFX_PASSWORD secret.' }
      - name: Build and sign Windows EXE
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'release-output/windows'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $project = Get-ChildItem native/windows -Recurse -Filter *.csproj | Select-Object -First 1
          dotnet publish $project.FullName -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o $out
          $pfx = Join-Path $env:RUNNER_TEMP 'hendy-windows-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw 'Windows SDK signtool.exe was not found.' }
          $executables = @(Get-ChildItem $out -Recurse -Filter *.exe)
          if ($executables.Count -eq 0) { throw 'dotnet publish did not produce an EXE.' }
          foreach ($exe in $executables) {
            & $signTool.FullName sign /fd SHA256 /f $pfx /p $env:WINDOWS_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($exe.Name)" }
            & $signTool.FullName verify /pa /v $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($exe.Name)" }
          }
          Remove-Item $pfx -Force
      - name: Validate macOS project and signing inputs
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MACOS_SCHEME: ${{ vars.MACOS_SCHEME }}
        run: |
          set -euo pipefail
          test -d native/macos || { echo "::error::Missing native/macos Xcode source. Add the real macOS project before running this target."; exit 1; }
          find native/macos -maxdepth 4 \( -name '*.xcworkspace' -o -name '*.xcodeproj' \) -print -quit | grep -q . || { echo "::error::No .xcworkspace/.xcodeproj found in native/macos."; exit 1; }
          for key in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_TEAM_ID APPLE_ID APPLE_APP_SPECIFIC_PASSWORD MACOS_SCHEME; do [[ -n "${!key:-}" ]] || { echo "::error::Missing macOS signing/config value $key."; exit 1; }; done
      - name: Build, sign, notarize and package macOS DMG
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MACOS_SCHEME: ${{ vars.MACOS_SCHEME }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/hendy-macos.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERT="$RUNNER_TEMP/macos-distribution.p12"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$MACOS_CERTIFICATE_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"
          PROJECT="$(find native/macos -maxdepth 4 -name '*.xcworkspace' -print -quit)"
          PROJECT_FLAG="-workspace"
          if [[ -z "$PROJECT" ]]; then PROJECT="$(find native/macos -maxdepth 4 -name '*.xcodeproj' -print -quit)"; PROJECT_FLAG="-project"; fi
          xcodebuild "$PROJECT_FLAG" "$PROJECT" -scheme "$MACOS_SCHEME" -configuration Release -archivePath "$RUNNER_TEMP/HendyMac.xcarchive" archive CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_IDENTITY="Developer ID Application"
          APP_PATH="$(find "$RUNNER_TEMP/HendyMac.xcarchive/Products/Applications" -maxdepth 2 -name '*.app' -print -quit)"
          test -n "$APP_PATH" || { echo "::error::Xcode archive did not contain an app bundle."; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          mkdir -p release-output/macos
          hdiutil create -volname "HendyAppStore" -srcfolder "$APP_PATH" -ov -format UDZO "release-output/macos/HendyAppStore-$RELEASE_VERSION.dmg"
          xcrun notarytool submit "release-output/macos/HendyAppStore-$RELEASE_VERSION.dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "release-output/macos/HendyAppStore-$RELEASE_VERSION.dmg"
          xcrun stapler validate "release-output/macos/HendyAppStore-$RELEASE_VERSION.dmg"
          rm -f "$CERT" "$KEYCHAIN"
      - name: Generate checksum manifest
        shell: bash
        run: node scripts/generate-release-manifest.mjs "release-output/${{ matrix.platform }}"
      - name: Keep signed build as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: hendy-release-${{ matrix.platform }}-${{ inputs.version }}
          path: |
            release-output/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Verify and upload ${{ matrix.platform }} release to private R2
    needs: build
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: production
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'all' && '["android","ios","windows","macos"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: hendy-app-releases
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate publisher credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret."; exit 1; }
          test -n "$R2_ACCESS_KEY_ID" || { echo "::error::Missing R2_ACCESS_KEY_ID secret."; exit 1; }
          test -n "$R2_SECRET_ACCESS_KEY" || { echo "::error::Missing R2_SECRET_ACCESS_KEY secret."; exit 1; }
      - name: Download signed build artifact
        uses: actions/download-artifact@v4
        with:
          name: hendy-release-${{ matrix.platform }}-${{ inputs.version }}
          path: release-output/${{ matrix.platform }}
      - name: Reverify manifest and upload to R2
        shell: bash
        run: node scripts/upload-release-r2.mjs "release-output/${{ matrix.platform }}" "${{ matrix.platform }}"
