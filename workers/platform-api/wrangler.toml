name = "hendy-platform-api"
main = "src/index.js"
compatibility_date = "2026-10-28"
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[vars]
APP_URL = "https://hendy-mini-app.pages.dev"
ADMIN_URL = "https://hendy-web-admin.pages.dev"
STOREFRONT_URL = "https://hendy-web-user.pages.dev"
CORS_ORIGINS = "https://hendy-mini-app.pages.dev,https://hendy-web-admin.pages.dev,https://hendy-web-user.pages.dev"
BOT_USERNAME = ""
MIN_DEPOSIT_VND = "10000"
GITHUB_OWNER = "ngogiaidy56-eng"
GITHUB_REPO = "HendyAppStoreBotTelegram"
MAX_DEPOSIT_VND = "100000000"
MAX_INIT_DATA_AGE_SECONDS = "86400"
SESSION_TTL_SECONDS = "3600"

[[d1_databases]]
binding = "DB"
database_name = "hendyappstore-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "../../database/migrations"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "hendy-app-releases"

[triggers]
crons = ["15 * * * *"]

[[queues.producers]]
binding = "JOBS"
queue = "hendy-jobs"
