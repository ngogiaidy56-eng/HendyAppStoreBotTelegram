name = "hendyappstorebotelegram"
main = "src/index.ts"
compatibility_date = "2026-10-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "none"

[vars]
GITHUB_OWNER = "ngogiaidy56-eng"
GITHUB_REPO = "HendyAppStoreBotTelegram"
MIN_DEPOSIT_VND = "10000"
MAX_DEPOSIT_VND = "100000000"
REFERRAL_REWARD_VND = "2000"
MAX_INIT_DATA_AGE_SECONDS = "86400"
SESSION_TTL_SECONDS = "3600"

[[d1_databases]]
binding = "DB"
database_name = "hendyappstore-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "database/migrations"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "hendy-app-releases"

[[kv_namespaces]]
binding = "DEDUPE"
id = "REPLACE_WITH_DEDUPE_KV_NAMESPACE_ID"

[[queues.producers]]
binding = "JOBS"
queue = "hendy-jobs"

[[queues.consumers]]
queue = "hendy-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "hendy-jobs-dlq"

[triggers]
crons = ["15 * * * *"]
